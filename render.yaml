services:
  # --- BACKEND SERVICE ---
  - type: web
    name: exam-platform-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # --- FRONTEND SERVICE ---
  - type: web
    name: exam-platform-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm run build
    staticPublishDir: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: exam-platform-backend
          property: host
        value: https://${HOST}/api
